<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Open Graph image 1200x630 — warm craft brand -->
  <rect width="1200" height="630" fill="#FAFAF9"/>

  <!-- Dot texture -->
  <g fill="#D6D3D1" opacity="0.5">
    <circle cx="60" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="220" cy="60" r="2"/><circle cx="1060" cy="60" r="2"/><circle cx="1140" cy="60" r="2"/>
    <circle cx="60" cy="140" r="2"/><circle cx="140" cy="140" r="2"/><circle cx="1140" cy="140" r="2"/>
    <circle cx="60" cy="490" r="2"/><circle cx="1140" cy="490" r="2"/>
    <circle cx="60" cy="570" r="2"/><circle cx="140" cy="570" r="2"/><circle cx="1060" cy="570" r="2"/><circle cx="1140" cy="570" r="2"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#EA580C"/>

  <!-- M monogram tile -->
  <rect x="468" y="130" width="72" height="72" rx="20" fill="#EA580C"/>
  <path d="M486 182V153L504 171L522 153V182" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark -->
  <text x="556" y="184" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700" font-size="52" fill="#1C1917" letter-spacing="-1.5">mesteri<tspan fill="#EA580C">.md</tspan></text>

  <!-- Tagline -->
  <text x="600" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="500" font-size="32" fill="#78716C" text-anchor="middle">Găsește meșterul potrivit pentru orice lucrare</text>

  <!-- Service icons row -->
  <rect x="300" y="350" width="80" height="80" rx="20" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="340" y="402" font-family="system-ui" font-size="36" text-anchor="middle">&#x1F527;</text>

  <rect x="420" y="350" width="80" height="80" rx="20" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="460" y="402" font-family="system-ui" font-size="36" text-anchor="middle">&#x1F3E0;</text>

  <rect x="540" y="350" width="80" height="80" rx="20" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="580" y="402" font-family="system-ui" font-size="36" text-anchor="middle">&#x26A1;</text>

  <rect x="660" y="350" width="80" height="80" rx="20" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="700" y="402" font-family="system-ui" font-size="36" text-anchor="middle">&#x1F3A8;</text>

  <rect x="780" y="350" width="80" height="80" rx="20" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="820" y="402" font-family="system-ui" font-size="36" text-anchor="middle">&#x1F33F;</text>

  <!-- Bottom text -->
  <text x="600" y="520" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#A8A29E" text-anchor="middle">Meșteri verificați &#8226; Oferte transparente &#8226; Recenzii reale</text>

